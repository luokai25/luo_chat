name: Free live email password authentication smoke
on:
  push:
    branches: [feature/social-android-test-20261023]
    paths:
      - '.github/workflows/live-auth-smoke.yml'
      - 'scripts/check-live-email-auth.mjs'
      - 'src/config.js'
      - 'src/app.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luo-live-auth-smoke
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify email Auth API with a nonexistent reserved-domain account
        run: node scripts/check-live-email-auth.mjs
