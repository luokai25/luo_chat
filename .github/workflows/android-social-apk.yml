name: Luo Chat Android Full Beta APK
on:
  push:
    branches: [feature/social-android-test-20261023]
    paths:
      - 'android/**'
      - '.github/workflows/android-social-apk.yml'
      - 'src/stories.js'
      - 'src/app.js'
      - 'src/android-native.js'
      - 'src/device-notifications.js'
      - 'tests/android-host.test.mjs'
      - 'src/experience.js'
      - 'src/auth-recovery.js'
      - 'src/auth-capabilities.js'
      - 'tests/auth-capabilities.test.mjs'
      - 'supabase/functions/luo-auth-compat/index.ts'
      - 'src/google-sign-in.js'
      - 'tests/google-sign-in-disabled.test.mjs'
      - 'public/index.html'
      - 'public/luo-session-boot.js'
      - 'public/luo-mobile-stability.js'
      - 'tests/android-session-restoration.test.mjs'
      - 'public/luo-auth-premium.css'
      - 'tests/username-login-compat.test.mjs'
      - 'tests/username-registration.test.mjs'
      - 'tests/ui.test.mjs'
      - 'tests/auth-route-guard.test.mjs'
      - 'tests/android-username-auth.test.mjs'
      - 'supabase/functions/luo-auth/index.ts'
      - 'src/story-interactions.js'
      - 'supabase/migrations/20261023180000_story_interactive_stickers.sql'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: luo-social-android-release
  cancel-in-progress: true
jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout approved GitHub source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install tested web dependencies
        run: npm ci --ignore-scripts
      - name: Verify credentials and Android controls
        timeout-minutes: 2
        run: |
          node scripts/check-secrets.mjs
          node --test tests/android-host.test.mjs tests/auth-capabilities.test.mjs
      - name: Build final bundled web assets
        timeout-minutes: 6
        run: npm run build
      - name: Run every web regression test
        timeout-minutes: 6
        run: node --test tests/*.test.mjs
      - name: Production dependency audit
        timeout-minutes: 3
        run: npm run audit:production
      - name: Verify Story RPC schema is part of release sources
        run: |
          test -s supabase/migrations/20261023180000_story_interactive_stickers.sql
          node --test tests/story-interactions.test.mjs
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled GitHub-hosted Android SDK
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' || test -d "$ANDROID_HOME/platforms/android-35"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Put verified web assets inside the test APK
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets android/app/src/main/res/drawable-nodpi
          cp -a dist/. android/app/src/main/assets/
          icon="$(find dist -maxdepth 1 -type f -name 'icon-192-*.png' | head -n 1)"
          test -n "$icon"
          cp "$icon" android/app/src/main/res/drawable-nodpi/luo_icon.png
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/sw.js
          echo "Packaged $(find android/app/src/main/assets -type f | wc -l) assets"
      - name: Compile and test debug-signed Android APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify APK signature, permissions and included app bundle
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/sw.js"
          cp "$APK" luo-chat-android-beta.apk
          sha256sum luo-chat-android-beta.apk | tee luo-chat-android-beta.apk.sha256
      - name: Upload APK to GitHub Actions as a free test artifact
        uses: actions/upload-artifact@v4
        with:
          name: luo-chat-android-beta-apk
          path: |
            luo-chat-android-beta.apk
            luo-chat-android-beta.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish optional Android prerelease to GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="luo-android-beta-$RUN_NO"
          gh release create "$TAG" \
            "luo-chat-android-beta.apk" \
            "luo-chat-android-beta.apk.sha256" \
            --target "$COMMIT_SHA" \
            --title "Luo Chat Android Beta #$RUN_NO" \
            --notes "Functional Android beta built from GitHub commit $COMMIT_SHA. Includes the username-only client, existing account login, chats and existing backend-backed features; Android permissions, file chooser, safe download manager, app-to-chat sharing, video fullscreen, native back navigation and generic device alerts while running. This is NOT Play Store signed, E2EE or a promise of closed-app push. New username registration and newest Story interactions require pending Supabase migrations. Debug signing keys can change per runner, requiring reinstall between beta releases." \
            --prerelease \
            --latest=false
      - name: Surface the verified APK artifact when Releases permission is unavailable
        if: always()
        run: |
          echo "### Luo Chat Android Beta build" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified signed APK + SHA-256 checksum: **Actions → this run → Artifacts → luo-chat-android-beta-apk**." >> "$GITHUB_STEP_SUMMARY"
          echo "This artifact works even when the GitHub token cannot create public releases. Installing the APK never requires disabling Play Protect." >> "$GITHUB_STEP_SUMMARY"
