name: Free username authentication database checks
on:
  push:
    branches:
      - feature/username-only-registration-20261023
    paths:
      - 'supabase/migrations/20261023130000_username_only_recovery_and_quotas.sql'
      - 'supabase/migrations/20261023130100_gate_direct_auth_signup.sql'
      - 'tests/sql/auth-free-db-*.sql'
      - '.github/workflows/auth-db-free-checks.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261023130000_username_only_recovery_and_quotas.sql'
      - 'supabase/migrations/20261023130100_gate_direct_auth_signup.sql'
      - 'tests/sql/auth-free-db-*.sql'
      - '.github/workflows/auth-db-free-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-username-db-test
  cancel-in-progress: true
jobs:
  test-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-testing-only
          POSTGRES_DB: auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ensure free PostgreSQL client
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test recovery codes and fair signup limits
        env:
          PGPASSWORD: local-testing-only
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: auth_ci
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/auth-free-db-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023130000_username_only_recovery_and_quotas.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/auth-free-db-checks.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023130100_gate_direct_auth_signup.sql
          psql -X -v ON_ERROR_STOP=1 -c "
            begin;
            insert into auth.users(id,email,raw_app_meta_data)
            values ('77777777-7777-4777-8777-777777777777',
             'luo-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@accounts.invalid','{}');
            update auth.users
              set raw_app_meta_data='{\"luo_registration_v2\":\"approved\"}'::jsonb
              where id='77777777-7777-4777-8777-777777777777';
            commit;"
          if psql -X -v ON_ERROR_STOP=1 -c "
            insert into auth.users(id,email,raw_app_meta_data)
            values ('88888888-8888-4888-8888-888888888888',
             'attacker@example.invalid','{}');"; then
            echo "FAIL: direct public email signup bypassed the deferred Auth registration gate"
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -c "
            select 1 / (case when
              (select count(*) from auth.users where id='11111111-1111-4111-8111-111111111111')=1
              and (select count(*) from auth.users where id='77777777-7777-4777-8777-777777777777')=1
              and (select count(*) from auth.users where id='88888888-8888-4888-8888-888888888888')=0
            then 1 else 0 end) as protected;"
          echo "PASS: recovery, quota, legitimate signup, legacy account and direct signup rejection"
