name: Fast email/password login to Chats check
on:
  push:
    branches: [feature/social-android-test-20261023]
    paths:
      - '.github/workflows/auth-ui-fast-check.yml'
      - 'src/app.js'
      - 'src/auth-recovery.js'
      - 'tests/email-password-auth.test.mjs'
      - 'tests/ui.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install offline-friendly cached dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Assert email/password login opens authenticated Chats
        timeout-minutes: 2
        run: node --test --test-name-pattern='valid email and password produce a session' tests/ui.test.mjs
      - name: Verify email/password controls and error handling
        timeout-minutes: 2
        run: node --test tests/email-password-auth.test.mjs
