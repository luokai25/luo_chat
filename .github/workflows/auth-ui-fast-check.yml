name: Fast username login to Chats check
on:
  push:
    branches: [feature/social-android-test-20261023]
    paths:
      - '.github/workflows/auth-ui-fast-check.yml'
      - 'src/app.js'
      - 'src/auth-capabilities.js'
      - 'tests/auth-capabilities.test.mjs'
      - 'tests/ui.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install offline-friendly cached dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Assert username login opens authenticated Chats
        timeout-minutes: 2
        run: node --test --test-name-pattern='valid username and password produce a session' tests/ui.test.mjs
      - name: Assert signup and recovery fail closed if backend lacks migrations
        timeout-minutes: 2
        run: node --test tests/auth-capabilities.test.mjs
