name: Auth UI diagnostic tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app.js'
      - 'tests/ui.test.mjs'
      - 'public/index.html'
      - 'public/luo-auth-premium.css'
      - '.github/workflows/auth-ui-diagnostics.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused auth and UI tests with a hard timeout
        run: timeout --signal=SIGTERM 55s node --test tests/ui.test.mjs tests/auth-recovery.test.mjs tests/auth-route-guard.test.mjs
