name: Free username authentication compatibility checks
on:
  push:
    branches: [feature/social-android-test-20261023]
    paths:
      - '.github/workflows/android-auth-compat-smoke.yml'
      - 'supabase/functions/luo-auth-compat/**'
      - 'tests/username-login-compat.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-auth-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/username-login-compat.test.mjs tests/username-login-edge.test.mjs tests/username-registration.test.mjs
      - name: Isolate Android sign-in browser regression
        run: |
          set +e
          timeout 25s node --test --test-name-pattern='signed-out startup validates inputs' tests/ui.test.mjs > isolated-auth.log 2>&1
          result=$?
          tail -180 isolated-auth.log
          if [ "$result" -eq 124 ]; then echo 'The regression process hung and was terminated by timeout.'; fi
          exit "$result"
