plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luoscreations.chat.socialtest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luoscreations.chat.socialtest'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.0-beta.2'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
