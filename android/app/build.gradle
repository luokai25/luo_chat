plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luoscreations.luochat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luoscreations.luochat'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
